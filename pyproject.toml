[project]
name = "jobs_hk"
version = "1.0"
description = "Hong Kong Labour Department Job Listing Scraper & AI Agent"
authors = [
    { name = "Jacko", email = "l2982211930@163.com" }
]
dependencies = [
    "httpx",
    "bs4",
    "sqlalchemy",
    "sqlmodel",
    "pydantic",
    "python-dotenv",
    "ollama",
    "openai",
    "mcp[cli]",
]

[project.scripts]
run-ask             = "jobs_hk.cli.ask:main"
run-search-job      = "jobs_hk.cli.search_jobs:main"
run-search-job-MT   = "jobs_hk.cli.search_jobs_multi_thread:main"
run-fill-job        = "jobs_hk.cli.fill_jobs:main"
run-fill-job-MT     = "jobs_hk.cli.fill_jobs_multi_threads:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "debugpy",
]
